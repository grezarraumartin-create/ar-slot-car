<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proyecto RXI</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity camera look-controls wasd-controls
          position="0 1.6 0">
        <a-cursor color="#26A9CB"></a-cursor>
      </a-entity>

      <a-scene cursor="rayOrigin: mouse"></a-scene>
      <a-assets>
        <a-asset-item id="auto" src="activos/auto.glb"></a-asset-item>
        <a-asset-item id="pista" src="activos/pista.glb"></a-asset-item>
      </a-assets>

      <a-entity gltf-model="#auto" position="3 1 -3" rotation="0 0 0"
        animation__enter="property: scale; to: 1.2 1.2 1.2;
                          dur: 200; startEvents: mouseenter"
        animation__leave="property: scale; to: 1 1 1;
                          dur: 200; startEvents: mouseleave"
        animation__click="property: position;
                          from: 3 1 -3; to: 3 1 20;
                          dur: 1000; startEvents: click">
      </a-entity>

      <a-entity gltf-model="pista" position="-10 2 5" rotation="0 0 0"></a-entity>

      <a-box position="-1 0.5-3" color="#212220"
      animation__enter="property: scale; to: 1.2 1.2 1.2;
                          dur: 200; startEvents: mouseenter"
        animation__leave="property: scale; to: 1 1 1;
                          dur: 200; startEvents: mouseleave"
      animation__click="property: rotation;
                        from: 0 0 0; to: 0 360 0;
                        dur: 1000; startEvents: click">
      </a-box>

      <a-sphere position="0 1.25 -5" radius="1.25" color="#c94024"></a-sphere>
      
      <a-plane rotation="-90 0 0" width="8" height="8" color="#527842" scale="10 10 10"></a-plane>
      <a-sky color="#705e78"></a-sky>
    </a-scene>
  </body>
</html>
