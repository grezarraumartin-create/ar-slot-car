<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Slot Car AR</title>

  <!--
    ============================================================
    SLOT CAR AR  ·  A-Frame 1.5.0 + WebXR (hit-test)
    ============================================================
    Estructura de carpetas esperada:

      /index.html           (este archivo)
      /activos/pista.glb
      /activos/auto.glb

    IMPORTANTE para probar en AR:
      · WebXR AR solo funciona en Chrome para Android (ARCore).
      · Requiere HTTPS. "localhost" cuenta como seguro SOLO en el
        mismo dispositivo. Para probar en tu móvil usa un túnel
        HTTPS (ej. `ngrok http 5500`) o servidor local con certificado.
      · En escritorio (sin AR) el juego arranca en "modo vista previa":
        la pista aparece frente a la cámara y se juega con ESPACIO.
  -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

    /* Contenedor del HUD: también es el "overlayElement" de WebXR (dom-overlay) */
    #hud {
      position: fixed; inset: 0;
      pointer-events: none;            /* deja pasar toques a la escena... */
      color: #fff; z-index: 10;
    }
    #hud > * { pointer-events: auto; } /* ...excepto a los elementos interactivos */

    /* Panel de velocidad */
    #speed-panel {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      min-width: 220px; padding: 10px 18px; text-align: center;
      background: rgba(0, 0, 0, .55); border: 1px solid rgba(255,255,255,.25);
      border-radius: 14px; backdrop-filter: blur(6px);
      pointer-events: none;
    }
    #speed-label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
    #speed-value { font-size: 40px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
    #speed-value small { font-size: 16px; font-weight: 500; opacity: .7; }
    #speed-bar { height: 6px; margin-top: 6px; background: rgba(255,255,255,.2); border-radius: 3px; overflow: hidden; }
    #speed-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #3ddc84, #ffd54a, #ff5252); }
    #lap-value { margin-top: 6px; font-size: 13px; opacity: .85; }

    /* Mensaje de ayuda */
    #help {
      position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%);
      padding: 8px 16px; font-size: 15px; white-space: nowrap;
      background: rgba(0, 0, 0, .55); border-radius: 999px;
      pointer-events: none;
    }

    /* Botón táctil (para móvil, donde no hay barra espaciadora) */
    #throttle-btn {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      width: 160px; height: 64px; border: 0; border-radius: 32px;
      font-size: 18px; font-weight: 700; letter-spacing: .06em; color: #fff;
      background: #e53935; box-shadow: 0 4px 14px rgba(0,0,0,.4);
      user-select: none; -webkit-user-select: none; touch-action: none;
    }
    #throttle-btn.active { background: #43a047; transform: translateX(-50%) scale(.96); }

    /* Mensajes de estado (carga, errores, colocar pista) */
    #status {
      position: absolute; top: 140px; left: 50%; transform: translateX(-50%);
      max-width: 85vw; padding: 8px 14px; text-align: center; font-size: 14px;
      background: rgba(0,0,0,.6); border-radius: 10px; pointer-events: none;
    }
    #status:empty { display: none; }
  </style>
</head>

<body>

  <!-- ===================== UI HTML SUPERPUESTA ===================== -->
  <div id="hud">
    <div id="speed-panel">
      <div id="speed-label">Velocidad</div>
      <div id="speed-value">0 <small>km/h</small></div>
      <div id="speed-bar"><div id="speed-bar-fill"></div></div>
      <div id="lap-value">Vueltas: 0</div>
    </div>

    <div id="status">Cargando modelos…</div>
    <div id="help">Mantén ESPACIO para acelerar</div>
    <button id="throttle-btn" type="button">ACELERAR</button>
  </div>

  <!-- ===================== ESCENA A-FRAME ===================== -->
  <!--
    webxr:
      · hit-test      -> detección de superficies para colocar la pista (requerido)
      · dom-overlay   -> permite que el HUD HTML se vea dentro de la sesión AR
    ar-hit-test:
      · componente nativo de A-Frame (>=1.2). Muestra un retículo sobre la
        superficie detectada; al tocar la pantalla, coloca "#world" ahí y
        emite el evento "ar-hit-test-select".
  -->
  <a-scene
    webxr="requiredFeatures: hit-test; optionalFeatures: dom-overlay, local-floor; overlayElement: #hud"
    ar-hit-test="target: #world"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
    vr-mode-ui="enabled: false"
    ar-mode-ui="enabled: true"
    loading-screen="enabled: false"
    game-manager>

    <!-- Carga de modelos 3D -->
    <a-assets timeout="20000">
      <a-asset-item id="pista" src="./activos/pista.glb"></a-asset-item>
      <a-asset-item id="auto"  src="./activos/auto.glb"></a-asset-item>
    </a-assets>

    <!-- Iluminación (en AR el fondo es la cámara real, por eso no hay <a-sky>) -->
    <a-entity light="type: ambient; intensity: 0.9; color: #ffffff"></a-entity>
    <a-entity light="type: directional; intensity: 1.2; castShadow: false" position="1 3 2"></a-entity>

    <!--
      Mundo del juego: pista + auto. Al colocar "#world" en una superficie,
      todo (pista y auto) se mueve junto. Ajusta "scale" si tus modelos
      resultan muy grandes o pequeños (0.5 = mitad del tamaño original).
    -->
    <a-entity id="world" position="0 0 -1.5" scale="0.5 0.5 0.5">

      <!-- Pista -->
      <a-entity id="track" gltf-model="#pista"></a-entity>

      <!--
        Auto + componente personalizado.
        Parámetros útiles:
          maxSpeed      velocidad máxima (unidades del modelo / s)
          acceleration  qué tan rápido acelera
          friction      qué tan rápido frena al soltar ESPACIO
          trackShape    "oval" (parametrico) o "custom" (lista de puntos)
          straight/radius  medidas del óvalo (en unidades del modelo)
          modelYaw      giro extra del modelo si "mira" hacia otro lado (0, 90, 180, -90)
          debug         true = dibuja la trayectoria para alinearla con la ranura
      -->
      <a-entity id="car"
        gltf-model="#auto"
        slot-car-controller="
          maxSpeed: 3.2;
          acceleration: 1.6;
          friction: 1.2;
          trackShape: oval;
          straight: 2.0;
          radius: 0.8;
          heightOffset: 0.02;
          modelYaw: 0;
          debug: true">
      </a-entity>
    </a-entity>

    <!-- Cámara (en escritorio permite mirar con el ratón; en AR la controla el dispositivo) -->
    <a-entity camera look-controls position="0 1.2 1"></a-entity>
  </a-scene>

  <script>
  /* =====================================================================
   * COMPONENTE: slot-car-controller
   * ---------------------------------------------------------------------
   * Física simple de un auto de slot car que recorre un circuito cerrado:
   *   · Define una trayectoria cerrada (curva Catmull-Rom) en el plano XZ,
   *     local al padre (#world). Por defecto un óvalo ajustable; también
   *     puedes pasar puntos propios con trackShape: custom.
   *   · Escucha la barra espaciadora (y un botón táctil) para acelerar.
   *   · Acelera progresivamente hasta maxSpeed y, al soltar, desacelera por
   *     fricción hasta detenerse.
   *   · Posiciona y orienta el auto según la tangente de la curva.
   * ===================================================================== */
  AFRAME.registerComponent('slot-car-controller', {
    schema: {
      maxSpeed:     { type: 'number',  default: 3.2 },  // unidades/seg
      acceleration: { type: 'number',  default: 1.6 },  // unidades/seg²
      friction:     { type: 'number',  default: 1.2 },  // desaceleración al soltar
      speedScale:   { type: 'number',  default: 30 },   // factor para mostrar "km/h"

      trackShape:   { type: 'string',  default: 'oval', oneOf: ['oval', 'custom'] },
      straight:     { type: 'number',  default: 2.0 },  // largo de rectas (óvalo)
      radius:       { type: 'number',  default: 0.8 },  // radio de curvas (óvalo)
      // Puntos propios "x,z; x,z; x,z..." (mínimo 4), usados si trackShape = custom
      points:       { type: 'string',  default: '' },

      heightOffset: { type: 'number',  default: 0.02 }, // altura del auto sobre la pista (eje Y)
      modelYaw:     { type: 'number',  default: 0 },    // corrección de orientación del modelo (grados)
      reverse:      { type: 'boolean', default: false },// recorrer la pista en sentido contrario
      debug:        { type: 'boolean', default: true } // dibuja la trayectoria
    },

    init: function () {
      this.speed = 0;            // velocidad actual (unidades/seg)
      this.distance = 0;         // distancia recorrida sobre la curva
      this.laps = 0;
      this.throttle = false;     // ¿se está acelerando?
      this.enabled = false;      // el juego arranca cuando la pista está colocada
      this.lastHud = 0;

      // Referencias a elementos del HUD
      this.hudSpeed = document.getElementById('speed-value');
      this.hudBar   = document.getElementById('speed-bar-fill');
      this.hudLap   = document.getElementById('lap-value');
      this.btn      = document.getElementById('throttle-btn');

      this.buildPath();
      this.bindInput();

      // Lo activa el game-manager (al colocar la pista o en modo escritorio)
      this.el.addEventListener('game-start', () => { this.enabled = true; });
      this.el.addEventListener('game-reset', () => this.reset());
    },

    update: function (oldData) {
      // Si cambian parámetros de la pista, la reconstruimos
      if (oldData && (oldData.trackShape !== this.data.trackShape ||
          oldData.straight !== this.data.straight ||
          oldData.radius !== this.data.radius ||
          oldData.points !== this.data.points ||
          oldData.debug !== this.data.debug)) {
        this.buildPath();
      }
    },

    /* ---------- Trayectoria ---------- */
    buildPath: function () {
      const d = this.data;
      let pts = [];

      if (d.trackShape === 'custom' && d.points.trim()) {
        // "x,z; x,z; ..." -> Vector3
        pts = d.points.split(';').map(s => {
          const [x, z] = s.split(',').map(Number);
          return new THREE.Vector3(x, 0, z);
        });
      } else {
        // Óvalo tipo "estadio": dos rectas (largo = straight) unidas por
        // dos semicírculos (radio = radius), centrado en el origen del mundo.
        const L2 = d.straight / 2, R = d.radius, steps = 12;
        // Semicírculo derecho: de (L/2,-R) a (L/2, R)
        for (let i = 0; i <= steps; i++) {
          const a = -Math.PI / 2 + Math.PI * (i / steps);
          pts.push(new THREE.Vector3(L2 + R * Math.cos(a), 0, R * Math.sin(a)));
        }
        pts.push(new THREE.Vector3(0, 0, R));            // punto medio recta superior
        // Semicírculo izquierdo: de (-L/2, R) a (-L/2,-R)
        for (let i = 0; i <= steps; i++) {
          const a = Math.PI / 2 + Math.PI * (i / steps);
          pts.push(new THREE.Vector3(-L2 + R * Math.cos(a), 0, R * Math.sin(a)));
        }
        pts.push(new THREE.Vector3(0, 0, -R));           // punto medio recta inferior
      }

      if (d.reverse) pts.reverse();

      // Curva cerrada y suave; getPointAt/getTangentAt la parametrizan por longitud de arco,
      // así la velocidad es constante en rectas y curvas.
      this.curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal');
      this.curveLength = this.curve.getLength();

      // Línea de depuración opcional (útil para alinear la ruta con la ranura real)
      if (this.debugLine && this.debugLine.parent) this.debugLine.parent.remove(this.debugLine);
      if (d.debug) {
        const geo = new THREE.BufferGeometry().setFromPoints(this.curve.getPoints(200));
        this.debugLine = new THREE.LineLoop(geo, new THREE.LineBasicMaterial({ color: 0x00ffff }));
        this.debugLine.position.y = d.heightOffset;
        const parent = this.el.parentNode && this.el.parentNode.object3D;
        if (parent) parent.add(this.debugLine);
      }

      this.placeCar(0);
    },

    /* ---------- Entrada: barra espaciadora + botón táctil ---------- */
    bindInput: function () {
      this.onKeyDown = (e) => {
        if (e.code === 'Space') {
          e.preventDefault();               // evita el scroll de la página
          if (!e.repeat) this.setThrottle(true);
        }
      };
      this.onKeyUp = (e) => {
        if (e.code === 'Space') { e.preventDefault(); this.setThrottle(false); }
      };
      window.addEventListener('keydown', this.onKeyDown);
      window.addEventListener('keyup', this.onKeyUp);

      // Botón táctil / ratón (pointer events cubren ambos)
      const b = this.btn;
      this.onBtnDown = (e) => { e.preventDefault(); b.setPointerCapture(e.pointerId); this.setThrottle(true); };
      this.onBtnUp   = (e) => { e.preventDefault(); this.setThrottle(false); };
      b.addEventListener('pointerdown', this.onBtnDown);
      b.addEventListener('pointerup', this.onBtnUp);
      b.addEventListener('pointercancel', this.onBtnUp);
      // Evita que tocar el botón dispare la "selección" de WebXR (recolocar pista)
      document.getElementById('hud').addEventListener('beforexrselect', (e) => e.preventDefault());

      // Si la ventana pierde el foco con la tecla pulsada, soltamos el acelerador
      window.addEventListener('blur', () => this.setThrottle(false));
    },

    setThrottle: function (on) {
      this.throttle = on;
      this.btn.classList.toggle('active', on);
    },

    reset: function () {
      this.speed = 0; this.distance = 0; this.laps = 0;
      this.placeCar(0);
    },

    /* ---------- Posición y orientación sobre la curva ---------- */
    placeCar: function (u) {
      const pos = this.curve.getPointAt(u);
      const tan = this.curve.getTangentAt(u);
      this.el.object3D.position.set(pos.x, this.data.heightOffset, pos.z);
      // El modelo "mira" hacia +Z por defecto; yaw = ángulo de la tangente en el plano XZ
      const yaw = Math.atan2(tan.x, tan.z) + THREE.MathUtils.degToRad(this.data.modelYaw);
      this.el.object3D.rotation.set(0, yaw, 0);
    },

    /* ---------- Bucle de física ---------- */
    tick: function (time, delta) {
      if (!this.enabled) return;
      const dt = Math.min(delta / 1000, 0.05);   // limita saltos al volver de otra pestaña
      const d = this.data;

      if (this.throttle) {
        // Aceleración progresiva: se vuelve más suave al acercarse a la velocidad máxima
        const k = 1 - 0.7 * (this.speed / d.maxSpeed);
        this.speed += d.acceleration * k * dt;
      } else {
        // Fricción simulada: frena hasta detenerse por completo
        this.speed -= d.friction * dt;
      }
      this.speed = THREE.MathUtils.clamp(this.speed, 0, d.maxSpeed);

      // Avanza por la curva y cuenta vueltas
      this.distance += this.speed * dt;
      if (this.distance >= this.curveLength) {
        this.distance -= this.curveLength;
        this.laps++;
      }
      this.placeCar(this.distance / this.curveLength);

      // HUD (limitado a ~30 actualizaciones/seg)
      if (time - this.lastHud > 33) {
        this.lastHud = time;
        this.hudSpeed.innerHTML = Math.round(this.speed * d.speedScale) + ' <small>km/h</small>';
        this.hudBar.style.width = (this.speed / d.maxSpeed * 100).toFixed(0) + '%';
        this.hudLap.textContent = 'Vueltas: ' + this.laps;
      }
    },

    remove: function () {
      window.removeEventListener('keydown', this.onKeyDown);
      window.removeEventListener('keyup', this.onKeyUp);
      if (this.debugLine && this.debugLine.parent) this.debugLine.parent.remove(this.debugLine);
    }
  });

  /* =====================================================================
   * COMPONENTE: game-manager
   * ---------------------------------------------------------------------
   * Coordina el flujo: carga de modelos, colocación de la pista en AR
   * (hit-test) y modo vista previa en escritorio.
   * ===================================================================== */
  AFRAME.registerComponent('game-manager', {
    init: function () {
      const scene = this.el;
      const status = document.getElementById('status');
      const car = document.getElementById('car');
      let loaded = 0;

      // 1) Seguimiento de la carga de modelos
      const onLoaded = () => {
        if (++loaded === 2) {
          status.textContent = scene.is('ar-mode')
            ? 'Apunta al suelo y toca la pantalla para colocar la pista'
            : 'Vista previa en escritorio · pulsa "AR" (móvil Android) para realidad aumentada';
          setTimeout(() => { if (!scene.is('ar-mode')) status.textContent = ''; }, 4000);
        }
      };
      ['track', 'car'].forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('model-loaded', onLoaded);
        el.addEventListener('model-error', () => {
          status.textContent = 'No se pudo cargar ./activos/' + (id === 'track' ? 'pista' : 'auto') + '.glb';
        });
      });

      // 2) Modo escritorio / vista previa: arrancamos de inmediato
      scene.addEventListener('loaded', () => {
        if (!scene.is('ar-mode')) car.emit('game-start');
      });

      // 3) Al entrar en AR: reiniciamos y esperamos a que el usuario coloque la pista
      scene.addEventListener('enter-vr', () => {
        if (scene.is('ar-mode')) {
          car.emit('game-reset');
          status.textContent = 'Apunta al suelo y toca la pantalla para colocar la pista';
          // La cámara de AR la controla el dispositivo; quitamos el desplazamiento de escritorio
          document.querySelector('[camera]').setAttribute('position', '0 0 0');
        }
      });

      // 4) El usuario toca para colocar la pista -> arranca el juego
      scene.addEventListener('ar-hit-test-select', () => {
        status.textContent = '';
        car.emit('game-start');
      });

      scene.addEventListener('exit-vr', () => {
        document.querySelector('[camera]').setAttribute('position', '0 1.2 1');
      });
    }
  });
  </script>
</body>
</html>
